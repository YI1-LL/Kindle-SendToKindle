# SendToKindle 配置文件
# 注意：
#   1. password 必须填邮箱「授权码 / 应用专用密码」，不是网页登录密码。
#   2. to 必须是你自己的 Kindle 专属邮箱（亚马逊后台可查），不是普通邮箱。
#   3. 本文件是纯文本，用 UTF-8 无 BOM + LF 保存；改完不需要重启 Kindle。
#
# 常见服务商：
#   QQ 邮箱    smtp.qq.com    465  use_ssl = true
#   163 邮箱   smtp.163.com   465  use_ssl = true
#   126 邮箱   smtp.126.com   465  use_ssl = true
#   Gmail      smtp.gmail.com 587  use_ssl = false   （走 STARTTLS，需应用专用密码）
#   Outlook    smtp.office365.com 587  use_ssl = false

[smtp]
host = smtp.qq.com
port = 465
use_ssl = true
user = your_email@qq.com
password = your_auth_code

# 可选：发件人地址，默认与 user 相同（部分服务商要求 From 必须等于登录账号，一般不用改）
# from = your_email@qq.com

# 可选：Kindle 老固件缺根证书导致 x509 报错时，临时设为 true 跳过校验（不推荐长期使用）
# insecure_skip_verify = false

# 可选：指定自备的 CA 证书 PEM（比 insecure_skip_verify 更安全）
# ca_file = /mnt/us/extensions/SendToKindle/ca.pem

[kindle]
to = yourname_123@kindle.com
