name: build-send_to_kindle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w" -o send_to_kindle-armv7 main.go

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: send_to_kindle-armv7
          path: send_to_kindle-armv7
